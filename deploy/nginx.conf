# Nginx configuration for sadeghvahidi.ir (VPS deployment)
# Place at: /etc/nginx/sites-available/sadeghvahidi.ir
# Enable: ln -s /etc/nginx/sites-available/sadeghvahidi.ir /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name sadeghvahidi.ir www.sadeghvahidi.ir;
    # Redirect HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name sadeghvahidi.ir www.sadeghvahidi.ir;

    # SSL (use certbot: certbot --nginx -d sadeghvahidi.ir -d www.sadeghvahidi.ir)
    ssl_certificate /etc/letsencrypt/live/sadeghvahidi.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sadeghvahidi.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    root /var/www/sadeghvahidi.ir;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy (self-contained site)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml image/svg+xml;

    # Cache static assets aggressively
    location ~* \.(css|js|woff2|woff|ttf|svg|png|jpg|jpeg|webp|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # HTML: short cache, revalidate
    location ~* \.html$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Clean URLs: try file, then directory, then 404
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Custom 404 page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Deny hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
