<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#FBF4EC">
<title>مهر گل صدر مقدم — روز مادر مبارک</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%239E3A55' d='M16 27S4 19.5 4 12.5A6.5 6.5 0 0 1 16 8.6 6.5 6.5 0 0 1 28 12.5C28 19.5 16 27 16 27z'/%3E%3C/svg%3E">
<link rel="preload" href="../../assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin><style>@font-face {
  font-family: "Vazirmatn";
  src: url("../../assets/fonts/Vazirmatn-Regular.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "Vazirmatn";
  src: url("../../assets/fonts/Vazirmatn-Bold.woff2") format("woff2");
  font-weight: 700;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #fbf4ec;
  --bg-deep: #f4e3d7;
  --ink: #2e2320;
  --muted: #8a7368;
  --accent: #b4485f;
  --accent-deep: #8e3348;
  --gold: #b98a46;
  --line: rgba(185, 138, 70, 0.32);
  --ring: 351.858;
}

* {
  box-sizing: border-box;
}

html {
  height: 100%;
}

body {
  margin: 0;
  min-height: 100%;
  min-height: 100svh;
  padding: clamp(1.4rem, 5vw, 3.5rem) clamp(1.1rem, 4vw, 2rem);
  padding-bottom: calc(clamp(1.4rem, 5vw, 3.5rem) + env(safe-area-inset-bottom));
  display: grid;
  place-items: center;
  overflow-x: hidden;
  color: var(--ink);
  font-family: "Vazirmatn", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  background-color: var(--bg);
  background-image:
    radial-gradient(120% 70% at 50% -12%, #fffaf4 0%, rgba(255, 250, 244, 0) 62%),
    radial-gradient(80% 46% at 50% 112%, rgba(180, 72, 95, 0.12) 0%, rgba(180, 72, 95, 0) 72%),
    linear-gradient(178deg, var(--bg) 0%, var(--bg-deep) 100%);
  background-attachment: fixed;
}

.stage {
  position: relative;
  width: 100%;
  max-width: 30rem;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: rise 0.9s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

/* ---------- ornament ---------- */

.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.6rem;
  margin: 0 0 1.15rem;
  color: var(--gold);
  animation: rise 0.9s 0.05s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.ornament span {
  width: clamp(1.6rem, 8vw, 2.6rem);
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--line));
}

.ornament span:last-child {
  background: linear-gradient(90deg, var(--line), transparent);
}

.ornament i {
  width: 5px;
  height: 5px;
  transform: rotate(45deg);
  background: var(--gold);
  opacity: 0.75;
}

.eyebrow {
  margin: 0 0 0.7rem;
  font-size: clamp(0.72rem, 2.6vw, 0.8rem);
  font-weight: 700;
  letter-spacing: 0.24em;
  color: var(--gold);
  animation: rise 0.9s 0.08s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.name {
  margin: 0;
  font-size: clamp(2.5rem, 10vw, 3.9rem);
  font-weight: 700;
  line-height: 1.16;
  letter-spacing: -0.01em;
  text-wrap: balance;
  animation: rise 0.9s 0.12s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.title {
  margin: 0.55rem 0 0;
  font-size: clamp(0.9rem, 3vw, 1rem);
  font-weight: 400;
  color: var(--muted);
  animation: rise 0.9s 0.16s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.lede {
  margin: 1.15rem 0 0;
  max-width: 21rem;
  font-size: clamp(0.95rem, 3.2vw, 1.05rem);
  line-height: 1.85;
  color: var(--muted);
  animation: rise 0.9s 0.2s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.photo {
  width: clamp(4.6rem, 18vw, 5.6rem);
  aspect-ratio: 1;
  margin-bottom: 1.3rem;
  border-radius: 50%;
  padding: 4px;
  background: linear-gradient(140deg, rgba(185, 138, 70, 0.55), rgba(180, 72, 95, 0.35));
  animation: rise 0.9s 0.02s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  display: block;
}

/* ---------- player ---------- */

.player {
  margin-top: clamp(2rem, 8vw, 2.9rem);
  display: flex;
  flex-direction: column;
  align-items: center;
  animation: rise 0.9s 0.26s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.halo {
  position: relative;
  width: clamp(11rem, 52vw, 13.5rem);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
}

.halo::before,
.halo::after {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: 50%;
  pointer-events: none;
}

.halo::before {
  inset: 4%;
  border: 1px solid rgba(185, 138, 70, 0.28);
}

.halo::after {
  inset: -7%;
  border: 1px dashed rgba(185, 138, 70, 0.22);
  animation: drift 60s linear infinite;
}

.disc {
  position: relative;
  width: 78%;
  aspect-ratio: 1;
  padding: 0;
  border: 0;
  border-radius: 50%;
  cursor: pointer;
  color: #fff;
  display: grid;
  place-items: center;
  background:
    radial-gradient(120% 110% at 30% 18%, #cd6077 0%, var(--accent) 46%, var(--accent-deep) 100%);
  box-shadow:
    0 24px 48px -18px rgba(142, 51, 72, 0.62),
    0 10px 22px -12px rgba(46, 35, 32, 0.35),
    inset 0 2px 0 rgba(255, 255, 255, 0.32),
    inset 0 -12px 26px rgba(90, 24, 40, 0.32);
  transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.3, 1), box-shadow 0.28s ease;
  -webkit-tap-highlight-color: transparent;
}

.disc:hover {
  transform: translateY(-2px);
}

.disc:active {
  transform: scale(0.975);
}

.disc:focus-visible {
  outline: 3px solid var(--gold);
  outline-offset: 6px;
}

.disc .glyph {
  width: 34%;
  display: grid;
  place-items: center;
  filter: drop-shadow(0 2px 3px rgba(70, 16, 28, 0.35));
}

.disc svg {
  width: 100%;
  height: auto;
  display: block;
}

.disc .icon-pause {
  display: none;
}

.is-playing .disc .icon-play {
  display: none;
}

.is-playing .disc .icon-pause {
  display: block;
}

.ring {
  position: absolute;
  inset: -7%;
  width: 114%;
  height: 114%;
  transform: rotate(-90deg);
  pointer-events: none;
}

.ring circle {
  fill: none;
  stroke-width: 2.4;
  stroke-linecap: round;
}

.ring .ring-bg {
  stroke: rgba(46, 35, 32, 0.08);
}

.ring .ring-fg {
  stroke: var(--gold);
  stroke-dasharray: var(--ring);
  stroke-dashoffset: var(--ring);
  transition: stroke-dashoffset 0.2s linear;
}

/* ---------- equalizer ---------- */

.bars {
  height: 1.35rem;
  margin-top: 1.5rem;
  display: flex;
  align-items: flex-end;
  gap: 5px;
  opacity: 0.35;
  transition: opacity 0.3s ease;
}

.bars i {
  display: block;
  width: 3px;
  height: 30%;
  border-radius: 3px;
  background: var(--accent);
}

.is-playing .bars {
  opacity: 1;
}

.is-playing .bars i {
  animation: eq 1.1s ease-in-out infinite;
}

.is-playing .bars i:nth-child(1) { animation-delay: 0s; }
.is-playing .bars i:nth-child(2) { animation-delay: 0.16s; }
.is-playing .bars i:nth-child(3) { animation-delay: 0.32s; }
.is-playing .bars i:nth-child(4) { animation-delay: 0.1s; }
.is-playing .bars i:nth-child(5) { animation-delay: 0.24s; }

.times {
  margin-top: 0.75rem;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.82rem;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
  letter-spacing: 0.02em;
}

.times .dot {
  opacity: 0.5;
}

/* ---------- closing ---------- */

.closing {
  margin: clamp(2.2rem, 9vw, 3.2rem) 0 0;
  padding-top: 1.1rem;
  position: relative;
  font-size: 0.92rem;
  color: var(--muted);
  animation: rise 0.9s 0.32s cubic-bezier(0.2, 0.75, 0.3, 1) both;
}

.closing::before {
  content: "";
  position: absolute;
  top: 0;
  right: 50%;
  transform: translateX(50%);
  width: 3.2rem;
  height: 1px;
  background: var(--line);
}

.hint {
  margin: 1.4rem 0 0;
  font-size: 0.74rem;
  color: rgba(138, 115, 104, 0.75);
  letter-spacing: 0.02em;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- motion ---------- */

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(14px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes drift {
  to {
    transform: rotate(360deg);
  }
}

@keyframes eq {
  0%, 100% { height: 22%; }
  50% { height: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
  .bars i {
    height: 60% !important;
  }
}

@media (min-width: 48rem) {
  .stage {
    max-width: 33rem;
  }
  .halo {
    width: 14rem;
  }
}
</style>
</head>
<body>
<main class="stage">

  <div class="ornament" aria-hidden="true"><span></span><i></i><span></span></div>
  <p class="eyebrow">روز مادر مبارک</p>
  <h1 class="name">مهر گل صدر مقدم</h1>
<p class="title">برای مادرش اعظم صفایی</p>  <p class="lede">این صدا، هدیهٔ مهر گل صدر مقدم برای توست</p>

  <section class="player" id="player" aria-label="پخش صدا">
    <div class="halo">
      <svg class="ring" viewBox="0 0 120 120" aria-hidden="true" focusable="false">
        <circle class="ring-bg" cx="60" cy="60" r="56"></circle>
        <circle class="ring-fg" cx="60" cy="60" r="56" id="ring"></circle>
      </svg>
      <button class="disc" id="play" type="button" aria-label="پخش صدا" aria-pressed="false">
        <span class="glyph">
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <path d="M8.6 4.9c0-1 1.1-1.6 2-1l8.6 5.9c.8.5.8 1.7 0 2.2l-8.6 5.9c-.9.6-2 0-2-1V4.9Z"/>
          </svg>
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
            <rect x="6.4" y="4.6" width="4" height="14.8" rx="1.6"/>
            <rect x="13.6" y="4.6" width="4" height="14.8" rx="1.6"/>
          </svg>
        </span>
      </button>
    </div>

    <div class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="times">
      <span id="cur">۰:۰۰</span>
      <span class="dot" aria-hidden="true">·</span>
      <span id="dur">—</span>
    </div>

    <audio id="audio" preload="metadata" src="../../audio/N6C26SS8VJJB.mp3"></audio>
    <p class="hint" id="err" hidden></p>
    <noscript>
      <audio controls preload="none" src="../../audio/N6C26SS8VJJB.mp3" style="margin-top:1rem;width:100%"></audio>
    </noscript>
  </section>

  <p class="closing">با تمام عشق، برای تو</p>
  <p class="hint">این صفحه فقط برای تو باز شده است</p>
</main>
<script src="../../assets/player.js"></script>
</body>
</html>
